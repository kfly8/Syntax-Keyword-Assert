name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        perl:
          [
            "5.44",
            "5.42",
            "5.40",
            "5.38",
            "5.36",
            "5.34",
            "5.32",
            "5.30",
            "5.28",
            "5.26",
            "5.24",
            "5.22",
            "5.20",
            "5.18",
            "5.16",
          ]
        include:
          - perl: 5.44
            coverage: true
            integration: true
          - perl: 5.42
            integration: true

    name: Perl ${{ matrix.perl }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup perl
        uses: shogo82148/actions-setup-perl@53e33bb27be492a926eee378e8a5f7ff6618b061 # v1.43.1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Install dependencies
        run: cpanm --installdeps --notest .

      - name: Install dependencies for integration tests
        if: ${{ matrix.integration }}
        run: |
          cpanm --notest Type::Tiny
          cpanm --notest Data::Checks
          cpanm --notest Syntax::Operator::Is

      - run: perl Build.PL
      - run: ./Build
      - run: ./Build test

      - name: Run coverage
        if: ${{ matrix.coverage }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cpanm --notest Devel::Cover::Report::Coveralls
          cover -test -report coveralls -ignore_re '^/opt'

